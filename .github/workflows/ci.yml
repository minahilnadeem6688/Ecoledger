name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend and smart contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Contract tests
        run: npm test
      - name: Server loads
        run: node -e "require('./app'); require('./api/index.js'); require('./config/blockchain'); require('./routes/activityRoutes'); require('./routes/studentRoutes'); require('./routes/rewardRoutes')"

  frontend:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Web build
        run: npx expo export --platform web
