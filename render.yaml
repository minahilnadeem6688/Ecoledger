# Render blueprint for the EcoLedger API (free web service).
# Render → New → Blueprint → pick this repo. Values marked "sync: false" are asked for once.
services:
  - type: web
    name: ecoledger-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: OWNER_PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: CORS_ORIGIN
        sync: false
